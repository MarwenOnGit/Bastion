name: policy-tests

# Bastion's equivalent of Huginn's replays: try to create non-compliant resources
# in bastion-test-rg and expect RequestDisallowedByPolicy. Runs as
# bastion-policy-tester (Contributor on bastion-test-rg only) in the
# bastion-policy-tests environment (main branch only).

on:
  workflow_dispatch:
    inputs:
      force_control:
        description: Run one control's test even if it is not Deny (the red half of the demo). Empty runs every Deny control.
        type: string
        required: false
  schedule:
    - cron: "47 3 * * *"

permissions: {}

concurrency:
  group: policy-tests
  cancel-in-progress: false

jobs:
  policy-tests:
    name: policy tests
    if: vars.AZURE_TESTER_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    environment: bastion-policy-tests
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      BASTION_LOCATION: ${{ vars.BASTION_LOCATION || 'francecentral' }}
      FORCE_CONTROL: ${{ inputs.force_control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_TESTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run policy tests
        run: |
          if [ -n "$FORCE_CONTROL" ]; then
            tests/policy/run-all.sh --force "$FORCE_CONTROL"
          else
            tests/policy/run-all.sh
          fi

      - name: Cleanup bastion-test-rg (always)
        if: always()
        run: tests/policy/cleanup.sh bastion-test-rg
