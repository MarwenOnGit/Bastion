name: plan

# terraform plan with the read-only bastion-github-plan identity (OIDC, no secret).
# Plans run with -lock=false: the identity can read state but not take a blob lease.
# The plan is checked with conftest and posted to the job summary.
#
# Skipped until the bootstrap has run and AZURE_PLAN_CLIENT_ID is set.

on:
  push:
    branches: [bastion-dev]
    paths: ["infra/**", "policies/**", "opa/**", ".github/workflows/plan.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", "policies/**", "opa/**", ".github/workflows/plan.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.1"
  CONFTEST_VERSION: "0.58.0"
  CONFTEST_SHA256: "0863738f798c1850269a121ef56c2df1ab88074204c480f282f3baf2726898fd"

jobs:
  plan:
    name: plan ${{ matrix.stack }}
    if: vars.AZURE_PLAN_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: [governance, network, workload]
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install conftest (pinned, checksum verified)
        run: |
          curl -sSLfo /tmp/conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  /tmp/conftest.tgz" | sha256sum -c -
          tar -xzf /tmp/conftest.tgz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest

      - name: Budget email for the governance stack
        if: matrix.stack == 'governance'
        run: echo "TF_VAR_budget_alert_emails=$(jq -cn --arg e "$BUDGET_ALERT_EMAIL" '[$e]')" >> "$GITHUB_ENV"

      - name: terraform init
        run: terraform -chdir="infra/$STACK" init -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"

      - name: terraform plan
        run: |
          terraform -chdir="infra/$STACK" plan -lock=false -out=tfplan
          terraform -chdir="infra/$STACK" show -json tfplan > "infra/$STACK/tfplan.json"

      - name: conftest
        run: conftest test --policy opa --no-color "infra/$STACK/tfplan.json"

      - name: Plan to job summary
        if: always()
        run: |
          {
            echo "## terraform plan: $STACK"
            echo
            echo '```'
            terraform -chdir="infra/$STACK" show -no-color tfplan 2>/dev/null | head -c 60000 || echo "no plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  not-configured:
    name: plan skipped (bootstrap not done)
    if: vars.AZURE_PLAN_CLIENT_ID == ''
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "::notice::AZURE_PLAN_CLIENT_ID is not set. Run the bootstrap and follow docs/SETUP.md."
